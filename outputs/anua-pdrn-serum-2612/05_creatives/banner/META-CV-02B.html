<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:'Paperlogy',sans-serif;color:#2B2B2B;position:relative;background:#FBF8F5;word-break:keep-all}
.ph{display:inline-block;border:2px dashed currentColor;border-radius:6px;padding:0 .2em;font-size:.62em;vertical-align:middle;line-height:1.3;opacity:.95}
.box{position:absolute;background:#D9D6D3;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6B6B6B;font-weight:600}
.logo{position:absolute;font-weight:800;letter-spacing:.12em}
.adtag{position:absolute;background:#2B2B2B;color:#fff;font-weight:700;border-radius:8px}
.band{position:absolute;left:0;right:0;background:#E8384F;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center}
.offer{display:inline-block;background:#E8384F;color:#fff;font-weight:800;border-radius:16px}
.notice{color:#6B6B6B;line-height:1.35}
.sub{display:inline-block;background:rgba(43,43,43,.6);color:#fff;font-weight:800;border-radius:12px;line-height:1.3}

</head>
<body style="margin:0;width:1080px;height:1350px;overflow:hidden">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#F8E1E7 0%,#FBF8F5 55%,#FFFFFF 100%)"></div>

<div class="box" style="left:700px;top:670px;width:260px;height:380px;background:#C9C5C1;border:4px solid #fff;font-size:30px">제품 컷</div>
<div style="position:absolute;left:65px;right:65px;bottom:30px;text-align:center"><div><span class="offer" style="font-size:46px;padding:12px 28px">올영세일 <span class="ph">[확정 후 기입: 할인율]</span> · <span class="ph">[확정 후 기입: 행사 기간]</span></span></div><div class="notice" style="font-size:22px;margin-top:14px">올영세일 기간 <span class="ph">[확정 후 기입: 행사 기간]</span>, 올리브영 온라인몰 기준, 구성·가격은 행사에 따라 달라질 수 있음</div></div>
<div class="logo" style="right:65px;top:30px;font-size:40px;color:#2B2B2B">ANUA</div>
