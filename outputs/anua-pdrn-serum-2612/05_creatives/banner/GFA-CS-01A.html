<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GFA-CS-01A 시안 1200x628</title>
<!-- GFA-CS-01A | 4번 소재 제작자 시안(2026-11-01). 외부 리소스 없음, 폰트는 변환 시 주입. 회색 박스 = 실제 촬영·제품 컷 자리. 이미지 시안 -->
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:'Paperlogy',sans-serif;color:#2B2B2B;position:relative;background:#FBF8F5;word-break:keep-all}
.ph{display:inline-block;border:2px dashed currentColor;border-radius:6px;padding:0 .2em;font-size:.62em;vertical-align:middle;line-height:1.3;opacity:.95}
.box{position:absolute;background:#D9D6D3;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6B6B6B;font-weight:600}
.logo{position:absolute;font-weight:800;letter-spacing:.12em}
.adtag{position:absolute;background:#2B2B2B;color:#fff;font-weight:700;border-radius:8px}
.band{position:absolute;left:0;right:0;background:#E8384F;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center}
.offer{display:inline-block;background:#E8384F;color:#fff;font-weight:800;border-radius:16px}
.notice{color:#6B6B6B;line-height:1.35}
.sub{display:inline-block;background:rgba(43,43,43,.6);color:#fff;font-weight:800;border-radius:12px;line-height:1.3}
</style>
</head>
<body style="margin:0;width:1200px;height:628px;overflow:hidden">
<div style="position:absolute;inset:0;background:linear-gradient(90deg,#FBF8F5 0%,#F8E1E7 100%)"></div>
<div class="box" style="left:600px;top:0;width:600px;height:628px;border-radius:0;font-size:30px">손등 캡슐 매크로 컷</div>
<div class="box" style="left:470px;top:200px;width:200px;height:380px;background:#C9C5C1;border:4px solid #fff;font-size:26px">제품 컷</div>
<div class="logo" style="left:60px;top:40px;font-size:34px">ANUA</div>
<div style="position:absolute;left:60px;top:120px;width:400px"><div style="font-size:50px;font-weight:800;line-height:1.25">톡 터지는 PDRN 캡슐 세럼</div><div style="margin-top:18px"><span class="offer" style="font-size:28px;padding:10px 20px">올영세일 <span class="ph">[확정 후 기입: 할인율]</span> · <span class="ph">[확정 후 기입: 행사 기간]</span></span></div><div class="notice" style="font-size:17px;margin-top:16px">올영세일 기간 <span class="ph">[확정 후 기입: 행사 기간]</span>, 올리브영 온라인몰 기준, 구성·가격은 행사에 따라 달라질 수 있음</div></div>
</body>
</html>
