<!DOCTYPE html>
<html lang="ko">
<head>

<title>PL-CS-01A 시안 800x220</title>
<!-- PL-CS-01A | 4번 소재 제작자 시안(2026-11-01). 외부 리소스 없음, 폰트는 변환 시 주입. 회색 박스 = 실제 촬영·제품 컷 자리. 네이버 검색결과 텍스트 광고 목업 -->
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:'Paperlogy',sans-serif;color:#2B2B2B;position:relative;background:#FBF8F5;word-break:keep-all}
.ph{display:inline-block;border:2px dashed currentColor;border-radius:6px;padding:0 .2em;font-size:.62em;vertical-align:middle;line-height:1.3;opacity:.95}
.box{position:absolute;background:#D9D6D3;border-radius:13px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6B6B6B;font-weight:600}
.logo{position:absolute;font-weight:800;letter-spacing:.12em}
.adtag{position:absolute;background:#2B2B2B;color:#fff;font-weight:700;border-radius:8px}
.band{position:absolute;left:0;right:0;background:#E8384F;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center}
.offer{display:inline-block;background:#E8384F;color:#fff;font-weight:800;border-radius:16px}
.notice{color:#6B6B6B;line-height:1.35}
.sub{display:inline-block;background:rgba(43,43,43,.6);color:#fff;font-weight:800;border-radius:12px;line-height:1.3}
</style>
</head>
<body style="margin:0;width:800px;height:220px;overflow:hidden">
<div style="position:absolute;inset:0;background:#FFFFFF"></div>
<div style="position:absolute;left:24px;top:20px;right:24px;border:1px solid #E4E4E4;border-radius:10px;padding:18px 22px;background:#fff">
<div style="font-size:14px;color:#6B6B6B"><span style="border:1px solid #9A9A9A;border-radius:3px;padding:0 5px;margin-right:8px;font-size:12px">광고</span>oliveyoung.co.kr</div>
<div style="font-size:22px;font-weight:700;color:#1A47C8;margin-top:8px">아누아 PDRN 캡슐 세럼</div>
<div style="font-size:16px;color:#3C3C3C;margin-top:6px;line-height:1.45">올영세일 <span class="ph">[확정 후 기입: 할인율]</span> 혜택. 톡 터지는 캡슐 세럼, 올리브영 온라인몰에서</div><div style="font-size:15px;color:#E8384F;margin-top:6px"><span class="ph">[확정 후 기입: 행사 기간]</span> 올영세일</div>
<div style="margin-top:10px"><span style="display:inline-block;border:1px solid #DADADA;border-radius:4px;padding:4px 10px;margin-right:8px;font-size:15px;color:#2B2B2B">세럼 보기</span><span style="display:inline-block;border:1px solid #DADADA;border-radius:4px;padding:4px 10px;margin-right:8px;font-size:15px;color:#2B2B2B">기획세트</span></div></div>
</body>
</html>
