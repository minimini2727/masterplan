<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>YT-AW-03A 시안 1920x1080</title>
<!-- YT-AW-03A | 4번 소재 제작자 시안(2026-11-01). 외부 리소스 없음, 폰트는 변환 시 주입. 회색 박스 = 실제 촬영·제품 컷 자리. 대표 프레임(첫 3초 훅 + 자막) -->
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:'Paperlogy',sans-serif;color:#2B2B2B;position:relative;background:#FBF8F5;word-break:keep-all}
.ph{display:inline-block;border:2px dashed currentColor;border-radius:6px;padding:0 .2em;font-size:.62em;vertical-align:middle;line-height:1.3;opacity:.95}
.box{position:absolute;background:#D9D6D3;border-radius:32px;display:flex;align-items:center;justify-content:center;text-align:center;color:#6B6B6B;font-weight:600}
.logo{position:absolute;font-weight:800;letter-spacing:.12em}
.adtag{position:absolute;background:#2B2B2B;color:#fff;font-weight:700;border-radius:8px}
.band{position:absolute;left:0;right:0;background:#E8384F;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center}
.offer{display:inline-block;background:#E8384F;color:#fff;font-weight:800;border-radius:16px}
.notice{color:#6B6B6B;line-height:1.35}
.sub{display:inline-block;background:rgba(43,43,43,.6);color:#fff;font-weight:800;border-radius:12px;line-height:1.3}
</style>
</head>
<body style="margin:0;width:1920px;height:1080px;overflow:hidden">
<div class="box" style="left:0;top:0;width:1920px;height:1080px;border-radius:0;font-size:44px;align-items:flex-start;padding:200px 200px 0">[대표 프레임 0~2초, 인스트림]<br>캡슐 톡 매크로 컷(가로)</div>
<div class="box" style="left:96px;top:520px;width:300px;height:400px;background:#C9C5C1;border:4px solid #fff;font-size:32px">제품 컷</div>
<div class="logo" style="right:96px;top:54px;font-size:52px">ANUA</div>
<div style="position:absolute;left:480px;right:480px;top:760px;height:212px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center"><div><span class="sub" style="font-size:60px;padding:8px 24px;margin:6px 0">캡슐이 톡,</span></div></div>
<div style="position:absolute;right:96px;bottom:72px"><div style="background:#2B2B2B;color:#fff;font-weight:800;font-size:44px;padding:18px 64px;border-radius:40px">구매하기</div></div>
<!-- CTA 버튼 "구매하기" 확정(QF-01), 11-14 관리자 화면 최종 확인 -->
</body>
</html>
